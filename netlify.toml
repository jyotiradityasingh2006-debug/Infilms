[build]
  publish = "frontend"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/"
  to = "/Index.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio"
  to = "/portfolio.html"
  status = 301
  force = true

[[redirects]]
  from = "/comments"
  to = "/comments.html"
  status = 301
  force = true
